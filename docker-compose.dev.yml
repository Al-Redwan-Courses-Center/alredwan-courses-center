services:
  redwan-db:
    image: postgres:17
    container_name: redwan-db-dev
    env_file:
      - ./backend/db.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redwan-backend:
    build: ./backend
    container_name: redwan-backend-dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      redwan-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen(''http://localhost:8000/health/'').getcode() == 200 else 1)"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redwan-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: redwan-frontend-dev
    stdin_open: true
    tty: true
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - REST_API_URL=http://redwan-backend:8000
      - WATCHPACK_POLLING=true
    depends_on:
      redwan-backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  postgres_data_dev:
  redis_data_dev:
