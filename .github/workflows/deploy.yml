name: Deploy to Production

on:
  push:
    branches:
      - test-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          command_timeout: 30m
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd /home/deploy/app
            git pull origin test-prod
            docker compose up --build -d
            docker image prune -f
