services:
  redwan-db:
    image: postgres:17
    container_name: redwan-db
    env_file:
      - ./backend/db.env
    # Remove ports - DB should not be exposed to host in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: redis
    # Remove ports - Redis should not be exposed to host in production
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redwan-backend:
    build: ./backend
    env_file:
      - ./backend/.env
    container_name: redwan-backend
    depends_on:
      redwan-db:
        condition: service_healthy
    ports:
      - "8000:8000"   # Gunicorn (HTTP)
      - "8001:8001"   # Uvicorn (WebSocket/ASGI)  ← ADD THIS
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/').getcode() == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redwan-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: final   # ← production stage, not dev
    container_name: redwan-frontend
    depends_on:
      redwan-backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
